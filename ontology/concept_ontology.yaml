# =============================================================================
# concept_ontology.yaml  —  Layer 2 keystone (design_robust_bim_architecture.md §4)
# =============================================================================
# ONE declarative home for "what words/concepts map to which canonical functions".
# It consolidates the synonym/classification tables that were drifting across the
# codebase (each fix touching one copy while another silently diverged — the EN/NL
# "commercial" retail-drift bug). Consumers (L1 ingest classifier, L3 retrieval /
# routing, L4 relevance / phrasing) all read THIS, so they cannot diverge.
#
# CP-2.1 status (2026-06-10): authored + loaded + gated as a FAITHFUL reproduction
# of the existing Python tables (localdocs/check_ontology_coverage.py proves the
# loader reproduces every term->slug mapping). It is NOT yet wired into the
# consumers — that is CP-2.2 (point the ingest classifier here; re-backfill must
# reproduce L1 with no diff) and CP-2.3 (delete the Python copies one at a time,
# harness green after each). Until then this file and the Python tables are in sync.
#
# Faithfulness note — the fields are kept VERBATIM equal to their Python sources so
# the loader reproduces behaviour exactly (no enrichment in CP-2.1; that comes once
# consumers read this file):
#   aliases          == _CANONICAL_SPACE_TYPE_SYNONYMS (space) / _ELEMENT_CLASS_SYNONYMS
#                       keys (element) / _TERM_SYNONYMS (room concepts)
#   classify_labels  == _SPACE_LABEL_TO_CANONICAL (ingest, ORDER-sensitive)
#   gebiedstype      == _GEBIEDSTYPE_TO_CANONICAL
#   ifc_classes      == _ELEMENT_CLASS_IFC_TYPES
#   vertical_circulation.{aliases,retrieval_terms} == _CONCEPT_EXPANSIONS
#
# -----------------------------------------------------------------------------
# Concept schema
#   kind: space_function | element_class | concept
#     space_function — an IfcSpace function = a `canonical_type` slug. A USER term
#       resolves by SUBSTRING/bidirectional match (the query-time
#       _normalize_canonical_space_type: `term==slug OR any(a in term or term in a)`),
#       iterated in `query_priority` order (first match wins — that is why e.g.
#       "store" resolves to storage, checked before retail).
#     element_class  — a structural IFC leaf class. A USER term resolves by EXACT
#       match (+ trailing-plural strip), matching _resolve_element_ifc_classes.
#     concept        — a cross-cutting / vocabulary concept (vertical circulation,
#       room-level words) with no single canonical_type of its own.
#   label            — human description.
#   aliases          — user/agent words, ANY language → routing + query resolution.
#   functions        — canonical_type slugs this concept counts (default: [<slug>]).
#   ifc_classes      — (element_class) exact IFC leaf types (object_type values).
#   gebiedstype      — (space_function) Dutch MiniBIM pset values that map here.
#   classify_labels  — (space_function) long_name/name substrings the ingest
#                      classifier matches when no GebiedsType pset is present.
#   classify_priority— GLOBAL order for classify_labels (lower checked first; first
#                      match wins — preserves the _SPACE_LABEL_TO_CANONICAL order).
#   query_priority   — GLOBAL order for alias resolution at query time (lower first;
#                      preserves the _CANONICAL_SPACE_TYPE_SYNONYMS iteration order).
#   retrieval_terms  — model-vocabulary seeds for keyword retrieval fallback (L3).
#   absence_note     — honest wording when the literal element is often not modelled.
# =============================================================================

version: 1

concepts:

  # ---- SPACE FUNCTIONS (IfcSpace canonical_type) -------------------------------
  # CP-C2: the Dutch INGEST-classifier vocab (the `gebiedstype` pset values and the
  # DUTCH subset of `classify_labels`) moved OUT of global into the VORM client overlay
  # (ontology/clients/653fbe80-e4c5-11ed-95e8-fdb8a484b2c4.yaml).
  # CP-C4: the substring-resolved `aliases` (the §3.3 collision-prone field read by
  # normalize_space_type / resolve_space_function) are now split by language — GLOBAL keeps
  # only the English/neutral terms; the DUTCH space aliases moved to the VORM client overlay
  # and the HEBREW ones to the Proceed project overlay, composed back for those datasets by
  # load_ontology(client_id=…, project_id=…). `keyword_synonyms` (exact-match keyword
  # expansion, shared across languages/clients) stay GLOBAL for now (deferred split).

  circulation:
    kind: space_function
    label: "circulation / traffic space (Verkeersruimte — corridor + stair/lift cores, one undivided zone)"
    aliases: [circulation, corridor, hallway, aisle]  # NL(gang,gangpad,verkeersruimte)→VORM, HE(מסדרון,פרוזדור)→Proceed (CP-C4)
    keyword_synonyms: [corridor, gang, hallway, aisle, מסדרון, פרוזדור]
    query_priority: 1
    # gebiedstype: [verkeersruimte] + Dutch classify (gang, trap, verkeersruimte) → VORM client overlay (CP-C2)
    classify_labels: [corridor, hallway, stair, elevator, lift, circulation]
    classify_priority: 2
    retrieval_terms: [verkeersruimte, corridor, gang, hallway, circulation]
    absence_note: >-
      Verkeersruimte is one lumped zone covering the corridor PLUS the stair and
      lift cores; the model does not subdivide it, so the bare corridor area cannot
      be isolated.

  apartment:
    kind: space_function
    label: "apartment / dwelling unit"
    aliases: [apartment, flat, dwelling, duplex]  # NL(appartement,woning)→VORM, HE(דירה,יחידה)→Proceed (CP-C4)
    keyword_synonyms: [apartment, appartement, woning, flat, unit, dwelling, דירה, יחידה]
    query_priority: 2
    # gebiedstype: [appartement, duplex] + Dutch classify (appartement, woning) → VORM overlay (CP-C2)
    classify_labels: ["live/work", studio, dwelling, apartment, "residential unit", unit]
    classify_priority: 9
    retrieval_terms: [appartement, woning, apartment, dwelling]

  storage:
    kind: space_function
    label: "storage (Berging inpandig)"
    aliases: [storage]  # NL(berging,opslag,opslagruimte)→VORM, HE(מחסן)→Proceed (CP-C4)
    keyword_synonyms: [storage, berging, opslagruimte, מחסן]
    query_priority: 3
    # gebiedstype: ["berging inpandig"] + Dutch classify (berging, opslag) → VORM overlay (CP-C2)
    classify_labels: [storage]
    classify_priority: 7
    retrieval_terms: [berging, storage, opslag]

  technical_room:
    kind: space_function
    label: "technical / plant / mechanical room (Techniekruimte)"
    aliases: [technical, "plant room", mechanical]  # NL(techniek,techniekruimte)→VORM (CP-C4)
    query_priority: 4
    # gebiedstype: [techniekruimte] + Dutch classify (techniek) → VORM overlay (CP-C2)
    classify_labels: [machine, utility, technical, plant, mechanical]
    classify_priority: 8
    retrieval_terms: [techniekruimte, technical, plant, mechanical]

  retail:
    kind: space_function
    label: "retail / commercial space"
    # 'commercial'/'commerciële' MUST resolve here — the ingest classify_labels maps
    # commercial->retail, so the query side must agree (the EN/NL drift bug).
    aliases: [retail, shop, store, commercial]  # NL(winkel,commercieel,commerciële,commerciele,winkelruimte,winkelfunctie)→VORM (CP-C4)
    query_priority: 5
    # gebiedstype: [retail] + Dutch classify (winkel) → VORM overlay (CP-C2)
    classify_labels: [retail, commercial, shop, store]
    classify_priority: 5
    retrieval_terms: [retail, winkel, commercial, shop]

  horeca:
    kind: space_function
    label: "horeca (food & beverage — restaurant / café / bar / kitchen)"
    aliases: [horeca, restaurant, cafe, café, bar]
    query_priority: 6
    # gebiedstype: [horeca] + Dutch classify (keuken) → VORM overlay (CP-C2)
    classify_labels: [café, cafe, restaurant, bar, dining, kitchen]
    classify_priority: 6
    retrieval_terms: [horeca, restaurant, cafe, keuken]

  parking:
    kind: space_function
    label: "parking / car park"
    aliases: [parking, garage]  # NL(parkeer,parkeerplaats)→VORM, HE(חניה)→Proceed (CP-C4)
    keyword_synonyms: [parking, parkeerplaats, garage, חניה, חנייה]
    query_priority: 7
    gebiedstype: []
    # Dutch classify (parkeer) → VORM overlay (CP-C2)
    classify_labels: [parking, garage]
    classify_priority: 1
    retrieval_terms: [parking, parkeerplaats, garage, carpark]

  bicycle_storage:
    kind: space_function
    label: "indoor bicycle storage (Fietsenstalling inpandig)"
    aliases: [bicycle, bike]  # NL(fiets,fietsenstalling)→VORM (CP-C4)
    query_priority: 8
    # gebiedstype: ["fietsenstalling inpandig"] → VORM overlay (CP-C2)
    classify_labels: []
    # model-vocabulary seeds: Dutch BIM names individual bike spots 'fietsplek' /
    # 'fietsparkeerplek' / 'bakfietsparkeerplek' (cargo-bike) — feed BIM keyword recall
    # (CP-3.3) and the BIM-synthesis prompt's bicycle example (graph.py, CP-2.3 step c).
    retrieval_terms: [fietsenstalling, fietsplek, fietsparkeerplek, bakfietsparkeerplek,
                      fiets, bicycle, bike]

  amenity:
    kind: space_function
    label: "shared amenity / common space (Voorziening)"
    aliases: [amenity, common, lounge]  # NL(voorziening)→VORM (CP-C4)
    query_priority: 9
    # gebiedstype: [voorziening] + Dutch classify (voorziening) → VORM overlay (CP-C2)
    classify_labels: [common, amenity, lounge, seating, bandstand]
    classify_priority: 10
    retrieval_terms: [voorziening, amenity, common, lounge]

  residential_zone:
    kind: space_function
    label: "whole-floor living zone (Woongebied — planning region, not a room)"
    aliases: ["residential zone", "living zone"]  # NL(woongebied)→VORM (CP-C4)
    query_priority: 10
    # gebiedstype: [woongebied] → VORM overlay (CP-C2)
    classify_labels: []
    retrieval_terms: [woongebied, "residential zone"]

  office:
    kind: space_function
    label: "office workspace"
    aliases: [office]  # NL(kantoor,bureau)→VORM, HE(משרד)→Proceed (CP-C4)
    keyword_synonyms: [office, kantoor, bureau, משרד]
    query_priority: 11
    gebiedstype: []
    # Dutch classify (kantoor) → VORM overlay (CP-C2)
    classify_labels: [office]
    classify_priority: 4
    retrieval_terms: [office, kantoor]

  lobby:
    kind: space_function
    label: "lobby / entrance hall"
    aliases: [lobby, foyer]  # NL(entree,hal)→VORM (CP-C4)
    query_priority: 12
    gebiedstype: []
    # Dutch classify (entree) → VORM overlay (CP-C2)
    classify_labels: [lobby, foyer]
    classify_priority: 3
    retrieval_terms: [lobby, entree, foyer, hal]

  outdoor:
    kind: space_function
    label: "outdoor space (terrace / garden / roof garden)"
    aliases: [outdoor, terrace, garden, patio, "roof garden", courtyard]
    query_priority: 13
    gebiedstype: []
    classify_labels: ["roof garden", "green roof", outdoor, terrace, garden, patio, plaza, park]
    classify_priority: 11
    retrieval_terms: [terrace, garden, "roof garden", outdoor]

  # ---- STRUCTURAL ELEMENT CLASSES (exact IFC leaf class) ------------------------
  # aliases here are EXACT-match keys (+ trailing-plural strip), NOT substrings.
  # IfcWallStandardCase is deliberately excluded from `wall` (product decision
  # 2026-06-10 — "wall" == IfcWall only; see _ELEMENT_CLASS_IFC_TYPES).

  wall:
    kind: element_class
    label: "wall"
    ifc_classes: [IfcWall]
    aliases: [wall, muur, wand, קיר]

  door:
    kind: element_class
    label: "door"
    ifc_classes: [IfcDoor]
    aliases: [door, deur, דלת]

  window:
    kind: element_class
    label: "window"
    ifc_classes: [IfcWindow]
    aliases: [window, raam, venster, חלון]

  column:
    kind: element_class
    label: "column / pillar"
    ifc_classes: [IfcColumn]
    aliases: [column, kolom, pillar, עמוד]

  beam:
    kind: element_class
    label: "beam"
    ifc_classes: [IfcBeam]
    aliases: [beam, balk, קורה]

  slab:
    kind: element_class
    label: "slab"
    ifc_classes: [IfcSlab]
    aliases: [slab, "floor slab"]

  stair:
    kind: element_class
    label: "stair / staircase"
    ifc_classes: [IfcStair]
    aliases: [stair, staircase, stairwell, trap, מדרגות]
    keyword_synonyms: [stair, trap, stairs, staircase, stairwell, מדרגות]

  railing:
    kind: element_class
    label: "railing / balustrade"
    ifc_classes: [IfcRailing]
    aliases: [railing, balustrade, leuning]

  roof:
    kind: element_class
    label: "roof"
    ifc_classes: [IfcRoof]
    aliases: [roof, dak, גג]

  space:
    kind: element_class
    label: "space (generic IfcSpace)"
    ifc_classes: [IfcSpace]
    aliases: [space, ruimte]

  # ---- CROSS-CUTTING & VOCABULARY CONCEPTS -------------------------------------

  vertical_circulation:
    kind: concept
    label: "vertical transportation / circulation core (the 'shaft' concept)"
    # aliases == _CONCEPT_EXPANSIONS.vertical_transport triggers (+ design seeds core/kern)
    aliases: [shaft, "structural shaft", schacht, koker, core, kern, stairwell,
              trappenhuis, "vertical transport", "verticaal transport",
              elevator, lift, stair, staircase, trap, verkeersruimte, circulation,
              מעלית, מדרגות]
    # canonical functions/classes that SATISFY this concept (query tools)
    functions: [stair, circulation, lift]
    # retrieval_terms == _CONCEPT_EXPANSIONS.vertical_transport vocab (VERBATIM)
    retrieval_terms: [stair, staircase, trap, vluchttrap, hoofdtrap, verkeersruimte, lift, schacht]
    absence_note: >-
      Many models have no discrete shaft element; report the vertical transport as
      stairs + circulation zones instead.

  elevator:
    kind: concept
    label: "elevator / lift"
    aliases: [elevator, lift, מעלית, "elevator shaft", "lift shaft", "lift core",
              brandweerlift, "firefighter lift", "fire lift"]
    keyword_synonyms: [elevator, lift, מעלית]
    functions: [lift]
    retrieval_terms: [elevator, lift, brandweerlift, schacht, shaft]
    # door_signals: an elevator/lift that has NO discrete IfcTransportElement node can
    # still be detected from its landing DOORS — a door whose name or Pset_DoorCommon
    # carries one of these markers is an elevator landing door. Structural encoding of
    # the F4 case (Sluisbuurt brandweerlift = 24 doors, no transport element / shaft
    # node) so the detection lives here, not as a one-off query heuristic. Matched
    # case-insensitively against the door name AND its psets_json.
    door_signals: [brandweerlift]
    # two_sided_markers: when present on a landing door's Reference, the lift is
    # accessed from two sides, so a floor's TWO landing doors serve ONE shaft.
    two_sided_markers: [tweezijdig, "two-sided", "two sided", double-sided]

  # OAT — underground/pneumatic waste collection (Ondergronds Afval Transport). The
  # requirement lives in the project documents (e.g. a 40 m² OAT-ruimte) but is NOT
  # modelled as a discrete BIM space/element (raw-IFC confirmed: "OAT" appears only as
  # coincidental GlobalId substrings). Honest-absence concept (F1, CP-4.3): no functions,
  # no ifc_classes — its only jobs are doc keyword recall + the absence_note.
  oat:
    kind: concept
    label: "underground waste collection (OAT — Ondergronds Afval Transport)"
    aliases: [oat, "oat-ruimte", "oat ruimte", "ondergronds afval transport", afvalinzameling,
              afvalverzamelpunt, "waste collection", "waste collection point", "underground waste",
              "afval transport"]
    retrieval_terms: [oat, "oat-ruimte", afvalinzameling, "ondergronds afval transport",
                      afvalverzamelpunt]
    absence_note: >-
      Underground waste collection (OAT / 'OAT-ruimte', Ondergronds Afval Transport) is
      typically NOT modelled as a discrete BIM space or element; the requirement (e.g. a
      dedicated OAT-ruimte and its area) is specified in the project documents, not the
      model — report it from the documents and state plainly that the BIM carries no
      discrete OAT space.

  # Room-level vocabulary (VERBATIM _TERM_SYNONYMS entries that have no distinct
  # canonical_type yet) — the single home for these words so retrieval/routing don't
  # re-grow private copies (CP-2.3 deletes _TERM_SYNONYMS once consumers read here).
  room:
    kind: concept
    label: "room (generic)"
    aliases: [room, kamer, ruimte, חדר, חלל]
    keyword_synonyms: [room, kamer, ruimte, חדר, חלל]
    retrieval_terms: [room, kamer, ruimte]

  toilet:
    kind: concept
    label: "toilet / bathroom"
    aliases: [toilet, bathroom, wc, restroom, שירותים, אמבטיה]
    keyword_synonyms: [toilet, bathroom, wc, restroom, שירותים, אמבטיה]
    retrieval_terms: [toilet, bathroom, wc]

  kitchen:
    kind: concept
    label: "kitchen"
    aliases: [kitchen, keuken, מטבח]
    keyword_synonyms: [kitchen, keuken, מטבח]
    retrieval_terms: [kitchen, keuken]

  living:
    kind: concept
    label: "living room"
    aliases: [living, woonkamer, salon, סלון]
    keyword_synonyms: [living, woonkamer, salon, סלון]
    retrieval_terms: [living, woonkamer]

  bedroom:
    kind: concept
    label: "bedroom"
    aliases: [bedroom, slaapkamer, "חדר שינה", שינה]
    keyword_synonyms: [bedroom, slaapkamer, "חדר שינה", שינה]
    retrieval_terms: [bedroom, slaapkamer]

  balcony:
    kind: concept
    label: "balcony / terrace / loggia"
    aliases: [balcony, balkon, balcon, terrace, loggia, מרפסת]
    keyword_synonyms: [balcony, balkon, balcon, מרפסת, terrace, loggia]
    retrieval_terms: [balcony, balkon, terrace, loggia]

  building_section:
    kind: concept
    label: "building section / block / wing / tower"
    aliases: [section, block, wing, zone, tower, sectie, blok, בלוק, כנף]
    keyword_synonyms: [section, block, wing, zone, tower, sectie, blok, בלוק, כנף]
    retrieval_terms: [section, block, tower, sectie, blok]


# =============================================================================
# PERMIT MEASURES + ROOM LABELS — MOVED to the Proceed/Hebrew PROJECT overlay (CP-C3).
# -----------------------------------------------------------------------------
# The `permit_measures:` extract paths are bound to ONE permit-form/DWFX enrichment
# schema, and the `room_labels:` are the Hebrew 2D-plan vocabulary of ONE properties-
# only project — both are PROJECT facts, not global (design_ontology_cascade.md §2).
# They now live in ontology/projects/3753f7c0-662c-11f1-94aa-bb3ed856feec.yaml and are
# composed back for that project by load_ontology(project_id="3753f7c0-…"). The global
# view therefore carries NO permit measures and NO room labels (asserted by
# check_ontology_coverage.py; reproduced only under expect_hebrew in
# check_ontology_compose.py). Adding a new permit schema / room vocabulary = drop a new
# ontology/projects/<project_id>.yaml, not edit this global file.
# =============================================================================


# =============================================================================
# materials  —  material vocabulary for "which elements are made of <material>?"
# =============================================================================
# The SINGLE HOME for the cross-language material terms used to match the
# `materials_json` blob (written by backfill_materials_json.py: IfcMaterial /
# IfcMaterialLayerSet / IfcMaterialConstituentSet names per element). Material
# names are stored in the MODEL's language (Dutch on Sluisbuurt: `hout_…`,
# `beton_…`, `glas_…`, `metaal_…`), so a user asking in English ("wood",
# "concrete") finds nothing unless the EN term is expanded to the model vocab.
#
# Consumed by the loader's `material_terms_for(term)` and the
# `find_elements_by_material` tool (bim_tools.py), which does
# `ANY(_t IN terms WHERE toLower(b.materials_json) CONTAINS _t)`. Each value is a
# material slug → list of SUBSTRING terms (EN + NL + common spellings) that
# appear inside material names. Keep terms specific enough not to cross-match
# (e.g. 'glas' not 'gl'); an unknown material falls back to the literal term.
materials:
  wood:      [hout, wood, houten, timber, clt, hsb]
  concrete:  [beton, concrete, gewapend beton]
  steel:     [staal, steel, stalen]
  aluminium: [aluminium, aluminum, metaal_aluminium]
  metal:     [metaal, metal]
  glass:     [glas, glass, glazen]
  brick:     [baksteen, metselwerk, brick, masonry]
  insulation: [isolatie, insulation, minerale wol, pir, eps]
  gypsum:    [gips, gypsum, gipsplaat, plasterboard]
