# Project-scoped BIM query knowledge for this Revit model. These are interpretation
# rules over observed graph fields and quantities, not global IFC assumptions.
bim_query_knowledge:
  area_plan:
    floor_plate_basis: BVO
    floor_plate_type: residential_zone
    semantics: >-
      A BVO residential-zone record represents the residential floor plate. Other
      area-plan records can overlap it and must not be added to that plate.

  massing_sections:
    calculation: section_heights
    route_terms: ["section heights", "various section heights", "height of the building", "building height"]
    slab_label: IfcSlab
    predefined_type_property: PredefinedType
    predefined_type_value: ROOF
    quantity_set: Qto_SlabBaseQuantities
    area_quantity: GrossArea
    primary_plate_min_largest_fraction: 0.5
    semantics: >-
      Primary massing tops are roof plates at least half the area of the largest roof
      plate. Smaller Dakterrasvloer fragments are terraces, not independent sections.

  tower_facade:
    calculation: facade_opening_percentage
    route_terms: ["opening percentage of the tower facade", "tower facade opening percentage"]
    wall_label: IfcWall
    wall_name_property: name
    wall_name_value: Klimaatgevel
    orientation_property: Orientatie
    wall_quantity_set: Qto_WallBaseQuantities
    opaque_area_quantity: GrossSideArea
    opening_labels: [IfcWindow, IfcDoor]
    external_property: IsExternal
    window_quantity_set: Qto_WindowBaseQuantities
    door_quantity_set: Qto_DoorBaseQuantities
    opening_area_quantity: Area
    repeated_floor_min_count: 2
    semantics: >-
      Equal repeated upper-floor facade schedules define the typical tower floor.
      Opening percentage is external window/door area divided by opening area plus
      oriented Klimaatgevel opaque area.

  tower_floor_area:
    calculation: tower_max_floor_area
    route_terms: ["tower's maximum floor area", "tower maximum floor area", "maximum tower floor area"]
    space_label: IfcSpace
    type_property: canonical_type
    floor_plate_type: residential_zone
    basis_property: Bepalingsmethode
    floor_plate_basis: BVO
    area_property: canonical_area_m2
    level_property: canonical_level
    repeated_floor_min_count: 2
    repeated_area_precision: 3
    semantics: >-
      Repeated upper-storey BVO residential-zone records are the tower floor plates.
      Other overlapping area-plan records and podium functions are outside this measure.

  residential_records:
    segment_code: MSH
    segment_meaning: unresolved_without_explicit_project_mapping
    free_sector_value: null
    physical_unit_identity: graph_distinct_identity
    physical_unit_identity_property: EenheidNummer
    physical_unit_identity_semantics: >-
      EenheidNummer is the Revit dwelling-unit number. Both levels of a duplex share
      one value, so physical dwelling counts must use distinct populated values.
    duplex_counting_rule: >-
      Two space records representing the lower and upper portions of one duplex count
      as one physical apartment, not two apartments.
    semantics: >-
      Apartment counts must use distinct EenheidNummer values from Neo4j. Never count
      apartment-space records as physical dwellings because both levels of a duplex
      share one dwelling-unit number. Segment counts must be calculated from explicit
      graph classifications whose project meaning has been established.
