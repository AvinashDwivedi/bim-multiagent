# =============================================================================
# CLIENT OVERLAY — material acronyms / abbreviations
# client_id: cf5f6380-f96d-11ed-829a-3560aa7f7b38  (QA)
# =============================================================================
# Source: "Materials Acronyms and Abbreviations - BE Materials.csv" (EN / HE / NL
# material families + BE abbreviation codes). This overlay carries ONLY a
# top-level `materials:` section — the cross-language substring vocabulary used by
# `ConceptOntology.material_terms_for()` / the `find_elements_by_material` tool to
# match the model's `materials_json` blob.
#
# COMPOSE SEMANTICS (compose_ontology → _merge_term_map, list-append deduped):
#   • The 9 slugs marked `# + global` (wood, concrete, steel, aluminium, metal,
#     glass, brick, insulation, gypsum) APPEND their CSV terms onto the global
#     material term lists — an English query ("wood") still resolves; the client's
#     abbreviations/HE/NL names are added on top. `timber`→wood, `masonry`→brick,
#     `insulation materials`→insulation are folded onto the matching global slug so
#     they extend it rather than shadowing it (global registers the shared term
#     first via setdefault).
#   • The remaining slugs are NEW material families added wholesale for this client.
#   • Terms are lowercased at load; each is a SUBSTRING matched with CONTAINS.
#
# CAVEAT (per user, informed choice): every abbreviation from the CSV is included,
# including short 2-char codes (AL, AC, GL, SS, PE, PA, PP, RA, HC, HT, PT …). These
# can cross-match unrelated names inside materials_json via the CONTAINS substring
# logic (e.g. `al` ⊂ `staal`/`metaal`). This is a deliberate recall-over-precision
# choice scoped to THIS client only; other clients/projects are unaffected
# (empty-overlay identity holds — see handoff_ontology_cascade.md).
# =============================================================================

