# VORM / Sluisbuurt residential fields. These mappings are not global BIM assumptions.
node_types:
  ifc_space:
    properties: [object_id, source, IFCtype, name, canonical_type, canonical_level, canonical_area_m2, Segment, Afnemer, Programma, WoningType]

query_entities:
  spaces:
    default_select: [object_id, ifc_class, name, type, level]
    fields:
      segment:
        property: Segment
        description: Housing or market segment code.
      owner:
        property: Afnemer
        description: Modelled owner, customer, or receiving party.
      room_count:
        property: Programma
        description: Modelled residential room-count programme.
      dwelling_type:
        property: WoningType
        description: Modelled dwelling-type code.
