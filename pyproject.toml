[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-bim-agent"
version = "0.1.0"
description = "Evidence-first agentic Q&A over BIM tree, properties, and SQLite IFC exports"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "openai>=2.0",
  "pydantic>=2.6",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
bim-agent = "bim_agent.cli:main"

[tool.setuptools.packages.find]
include = ["bim_agent*", "bim_agents*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --basetemp=test-tmp/run"
pythonpath = ["."]
