[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bim-multiagent"
version = "0.1.0"
description = "Provider-neutral evidence-first agent system for project-scoped BIM graphs in Neo4j"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0,<2",
    "fastapi>=0.116,<1",
    "neo4j>=6,<7",
    "openai>=2.53,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<9", "pytest-asyncio>=0.25,<1"]

[tool.setuptools.packages.find]
include = ["bim_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
